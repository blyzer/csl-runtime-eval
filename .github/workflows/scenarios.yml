name: Gate 1 scenario evaluation

# W2.X1-X5, W3.S1-S2 and W4.S1-S6 (ADR-0007). One job per scenario, each internally
# paired (candidates alternate within the job); different jobs run on different
# runner instances, so compare candidates within a scenario, not seconds across them.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native Linux architecture
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-24.04]
        default: ubuntu-24.04-arm
      preset:
        description: Corpus scale
        type: choice
        options: [S]
        default: S
      scenarios:
        description: JSON array of scenario ids
        type: string
        default: '["W2.X1","W2.X2","W2.X3","W2.X4","W2.X5","W3.S1","W3.S2","W4.S1","W4.S2","W4.S3","W4.S4","W4.S5","W4.S6"]'
      repeat:
        description: Repeats per query and candidate
        type: string
        default: '10'

permissions:
  contents: read

concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install pinned native toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-08 --profile minimal --component rustfmt,clippy
          rustup override set nightly-2026-08-08
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt ziglang==0.14.1
          ln -s "$(.venv/bin/python -c 'import ziglang,pathlib; print(pathlib.Path(ziglang.__file__).parent / "zig")')" .venv/bin/zig
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prototypes/rust
            prototypes/hybrid
          key: ${{ inputs.runner }}
      - uses: actions/cache@v4
        with:
          path: |
            prototypes/zig/.zig-cache
            prototypes/hybrid/zig/.zig-cache
          key: zig-0.14.1-${{ inputs.runner }}-${{ hashFiles('prototypes/zig/**/*.zig', 'prototypes/hybrid/zig/**/*.zig', 'prototypes/hybrid/zig/build.zig') }}
          restore-keys: |
            zig-0.14.1-${{ inputs.runner }}-
      - name: Validate source and native candidates
        run: |
          set -euo pipefail
          ./ci/verify-manifest.sh
          ./ci/smoke.sh > results-smoke.log 2>&1
          ./ci/check-candidates.sh > results-checks.log 2>&1
          # check-candidates also installs a debug Zig executable; restore release.
          python harness/benchctl.py build rust
          python harness/benchctl.py build zig
          python harness/benchctl.py conformance --candidate rust --candidate zig --profile
      - name: Disable swap for controlled memory measurements
        # Hosted runners ship 3 GB of swap. A few pages of unrelated swap-out during
        # a large-RSS sample (M/hybrid peaks ~10.7 GB) trip the strict "swap-out
        # counter must not increase" rule without any real memory pressure. Removing
        # swap keeps that rule strict and makes a genuine overrun fail loudly (OOM).
        run: |
          mkdir -p results/hosted-context
          swapon --show > results/hosted-context/swap-before.txt || true
          sudo swapoff -a
          swapon --show > results/hosted-context/swap-after.txt || true
          free -b
      - name: Record runner context
        env:
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          mkdir -p results/hosted-context
          uname -a > results/hosted-context/uname.txt
          lscpu > results/hosted-context/cpu.txt
          free -b > results/hosted-context/memory.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys = ['GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
                  'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_LABEL', 'ImageOS', 'ImageVersion']
          Path('results/hosted-context/run.json').write_text(json.dumps({k:os.environ.get(k) for k in keys},indent=2)+'\n')
          PY
      - name: Run scenario campaign
        env:
          PRESET: ${{ inputs.preset }}
          SCENARIO: ${{ matrix.scenario }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -euo pipefail
          python harness/benchctl.py build hybrid
          mkdir -p results/scenarios
          variants=$(python -c "import os; from harness.scenarios import REGISTRY; print(' '.join(REGISTRY[os.environ['SCENARIO']]['variants']))")
          for variant in $variants; do
            out="results/scenarios/${SCENARIO}-${variant}-${PRESET}-${GITHUB_RUN_ID}"
            python harness/campaign.py run --scenario "$SCENARIO" --variant "$variant" --preset "$PRESET" \
              --repeat "$REPEAT" --seed 20260929 --max-load-per-cpu 0.75 --output "$out" | tee "$out.log"
          done
      - name: Upload evidence, including failed or blocked attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}-${{ inputs.preset }}-${{ inputs.runner }}-${{ github.run_id }}
          retention-days: 7
          path: |
            results/
            !results/**/references/**
            results-smoke.log
            results-checks.log
          if-no-files-found: error
